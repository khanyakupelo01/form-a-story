<!DOCTYPE html>
<html lang="en" dir="ltr">

<head>
  <meta charset="utf-8" />
  <link rel="stylesheet" href="style.css" />
  <link href="https://fonts.googleapis.com/css?family=Open+Sans" rel="stylesheet" />
  <title>Form a Story</title>
</head>

<body>
  <section id="top">
    <img src="https://content.codecademy.com/courses/learn-html-forms/formAStoryLogo.svg" alt="Form A Story Logo" />
  </section>

  <section id="main">
    <h1>
      Complete the Form -<br />
      Complete the Story!
    </h1>
    <hr />
    <!--Add your form below:-->
    <form action='story.html' method='get'>
      <label for='animal-1'>Animal:</label>
      <input type='text' id='animal-1' name='animal-1' required /><br /><br />

      <label for='animal-2'>Another Animal:</label>
      <input type='text' id='animal-2' name='animal-2' required /><br /><br />

      <label for='animal-3'>Yet Another Animal:</label>
      <input type='text' id='animal-3' name='animal-3' required /><br /><br />

      <label for='' adj-1''>Adjective:</label>
      <input type='text' id='adj-1' name='adj-1' required /><br /><br />
      <label for='verb-1'>Verb:</label>
      <input type='text' id='verb-1' name='verb-1' required /><br /><br />

      <label for='num-1'>Number:</label>
      <input type='number' id='num-1' name='num-1' required /><br /><br />

      <span>
        <label for='yes'>Yes</label>
        <input type='radio' id='yes' name='answer' value='yes' required />
        <label for='no'>No</label>
        <input type='radio' id='no' name='answer' value='no' required />
      </span>
      <br />

      <label for='speed'> Relative Speed:</label>
      <select id='speed' name='speed' required>
        <option value='' disabled selected>Select an option</option>
        <option value='slow'>Slow</option>
        <option value='medium'>Medium</option>
        <option value='fast'>Fast</option>
      </select>
      <br />

      <label for='quote'> Motivational Quote:</label>
      <input type='text' id='quote' name='quote' required list='quote-choices' /><br /><br />

      <datalist id='quote-choices'>
        <option value="Believe you can and you're halfway there.">
        <option value="The only way to do great work is to love what you do.">
        <option value="Success is not final, failure is not fatal: It is the courage to continue that counts.">
      </datalist>
      <br />

      <label for='message'>Motivational Message:</label>
      <textarea id='message' name='message' rows='4' cols='50' placeholder='Write your motivational message here...'
        required></textarea><br /><br />
      <input type='submit' value='Submit' />
    </form>
  </section>
</body>

</html>
